# MJ코인 윈도우 설치 파일을 깃허브의 윈도우 PC에서 만든다.
# 만든 파일은 "windows-build" 릴리스에 MJCoin_Setup.exe 로 올라간다 (로그인 없이 내려받기 가능).
name: 윈도우 설치 파일

on:
  push:
    branches: [main]
    paths:
      - "MJ코인_윈도우_소스/**"
      - ".github/workflows/windows.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: MJ코인_윈도우_소스
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # PyInstaller 기본 실행기(미리 만들어 둔 것)는 백신에 자주 걸려서 여기서 직접 컴파일한다
      - name: 패키지 설치
        env:
          PYINSTALLER_COMPILE_BOOTLOADER: "1"
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-binary pyinstaller pyinstaller
          python -m pip install -r requirements.txt

      - name: 프로그램 만들기
        run: python -m PyInstaller --noconfirm --onedir --collect-submodules winrt --windowed --name MJCoin --icon mjcoin.ico --add-data "web;web" --add-data "mjcoin.ico;." mj_coin_win.py

      - name: 설치 파일 만들기
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe")) { choco install nsis -y --no-progress }
          & "${env:ProgramFiles(x86)}\NSIS\makensis.exe" mjcoin.nsi
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-FileHash dist\MJCoin_Setup.exe -Algorithm SHA256

      - uses: actions/upload-artifact@v4
        with:
          name: MJCoin_Setup
          path: MJ코인_윈도우_소스/dist/MJCoin_Setup.exe

      - name: 릴리스에 올리기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete windows-build --yes --cleanup-tag 2>$null
          $global:LASTEXITCODE = 0
          gh release create windows-build dist/MJCoin_Setup.exe --title "MJ코인 윈도우 설치 파일" --notes "커밋 ${{ github.sha }} 에서 깃허브 윈도우 PC로 만든 설치 파일" --target ${{ github.sha }}
