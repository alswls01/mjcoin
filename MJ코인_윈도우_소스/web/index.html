<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>MJ코인</title>
<style>
  :root { --bg:#0e1117; --panel:#161b24; --line:#262d3a; --text:#e6e9ef; --dim:#8b93a5; --up:#ef4f4f; --down:#3b82f6; --accent:#7c5cff; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--text);
    font-family:"Pretendard","Noto Sans CJK KR",sans-serif; overflow:hidden; }
  body { display:flex; flex-direction:column; }
  #top { display:flex; gap:8px; padding:10px 12px 6px; }
  .coin { flex:1; background:var(--panel); border:1px solid var(--line); border-radius:10px;
    padding:8px 12px; cursor:pointer; transition:border-color .15s; }
  .coin.on { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent) inset; }
  .coin .name { font-size:13px; color:var(--dim); }
  .coin .price { font-size:20px; font-weight:700; margin-top:2px; font-variant-numeric:tabular-nums; }
  .coin .chg { font-size:13px; font-variant-numeric:tabular-nums; }
  .up { color:var(--up); } .down { color:var(--down); } .flat { color:var(--dim); }
  #bar { display:flex; align-items:center; gap:6px; padding:4px 12px 8px; flex-wrap:wrap; }
  #bar button { background:var(--panel); color:var(--text); border:1px solid var(--line);
    border-radius:7px; padding:5px 10px; font-size:13px; cursor:pointer; font-family:inherit; }
  #bar button.on { background:var(--accent); border-color:var(--accent); }
  #bar .sep { width:1px; height:20px; background:var(--line); margin:0 4px; }
  #bar .info { margin-left:auto; color:var(--dim); font-size:12px; }
  #wrap { position:relative; flex:1; min-height:0; }
  #bar2 { display:flex; align-items:center; gap:6px; padding:0 12px 8px; flex-wrap:wrap; }
  #bar2 button { background:var(--panel); color:var(--text); border:1px solid var(--line);
    border-radius:7px; padding:4px 9px; font-size:12px; cursor:pointer; font-family:inherit; }
  #bar2 button.on { background:#2a2350; border-color:var(--accent); }
  #bar2 .info { color:var(--dim); font-size:12px; margin-left:auto; }
  #chart { position:absolute; inset:0 0 0 0; }
  #vp { position:absolute; inset:0; pointer-events:none; z-index:2; }
  #legend { position:absolute; left:12px; top:6px; z-index:3; font-size:12px; color:var(--dim);
    font-variant-numeric:tabular-nums; pointer-events:none; }

  /* ---------- 기본 테마: 새 구조를 예전 배치 그대로 ---------- */
  #ribbon, #sheet, #cells, .grp { display:contents; }
  .xl-only { display:none !important; }
  #top { order:1; } #bar { order:2; } #bar2 { order:3; } #wrap { order:4; }

  /* ---------- 엑셀 테마 ---------- */
  body.excel { --xg:#217346; --xline:#e1e1e1; background:#fff; color:#222;
    font-family:"Malgun Gothic","맑은 고딕","Noto Sans CJK KR",sans-serif; font-size:13px; }
  body.excel .xl-only { display:revert !important; }
  body.excel #xl-title { display:flex !important; align-items:center; height:30px; background:var(--xg); color:#fff; padding:0 10px; font-size:12px; flex:none; }
  body.excel #xl-title .qa { display:flex; align-items:center; gap:12px; flex:1; }
  body.excel #xl-title svg { width:15px; height:15px; }
  body.excel .sw { display:inline-block; width:26px; height:12px; border:1px solid #fff; border-radius:7px; vertical-align:-2px; position:relative; margin:0 3px; }
  body.excel .sw::after { content:""; position:absolute; left:2px; top:2px; width:6px; height:6px; border-radius:50%; background:#fff; }
  body.excel #xl-title .ttl { flex:1; text-align:center; font-size:12.5px; }
  body.excel #xl-title .srch { flex:1; display:flex; justify-content:flex-end; opacity:.85; }
  body.excel #xl-tabs { display:flex !important; background:var(--xg); color:#fff; height:28px; align-items:flex-end; padding:0 6px; gap:2px; flex:none; font-size:12.5px; }
  body.excel #xl-tabs span { padding:5px 12px 6px; cursor:default; }
  body.excel #xl-tabs span:hover { background:rgba(255,255,255,.15); }
  body.excel #xl-tabs span.on { background:#f3f3f3; color:var(--xg); }
  body.excel #ribbon { display:flex; background:#f3f3f3; border-bottom:1px solid #d5d5d5; height:88px; padding:4px 4px 0; flex:none; overflow:hidden; }
  body.excel .grp { display:flex; flex-direction:row; position:relative; padding:0 8px 18px; border-right:1px solid #dadada; gap:6px; align-items:flex-start; }
  body.excel .grp .cap { position:absolute; left:0; right:0; bottom:2px; text-align:center; font-size:11px; color:#666; display:block !important; }
  body.excel .paste { display:flex; flex-direction:column; align-items:center; font-size:11.5px; width:52px; }
  body.excel .paste svg { width:32px; height:32px; margin:2px 0; }
  body.excel .smalls { display:flex; flex-direction:column; gap:0; font-size:11.5px; line-height:20px; color:#333; }
  body.excel .font { display:flex; gap:3px; margin-top:3px; }
  body.excel #ribbon .grp:nth-child(2) { flex-direction:column; gap:2px; }
  body.excel .fbox { border:1px solid #c6c6c6; background:#fff; padding:1px 6px; font-size:11.5px; width:110px; }
  body.excel .fbox.sz { width:38px; }
  body.excel .fb { width:22px; text-align:center; font-size:12px; color:#333; font-style:normal; }
  body.excel i.fb { font-style:italic; }
  body.excel #bar, body.excel #bar2 { display:grid; padding:2px 0 0; gap:1px 2px; grid-auto-flow:column; }
  body.excel #bar { grid-template-rows:repeat(3, 21px); }
  body.excel #bar2 { grid-template-rows:repeat(3, 21px); }
  body.excel #bar button, body.excel #bar2 button { background:transparent; color:#262626; border:1px solid transparent; border-radius:0;
    padding:0 6px; font-size:11.5px; text-align:left; height:21px; }
  body.excel #bar button:hover, body.excel #bar2 button:hover { background:#d2e8db; border-color:#c4d9cc; }
  body.excel #bar button.on, body.excel #bar2 button.on { background:#c5ddcf; border-color:#a9c9b6; }
  body.excel #bar .sep { display:none; }
  body.excel #bar3 { display:grid; grid-template-rows:repeat(3, 21px); gap:1px; padding-top:2px; }
  body.excel #bar3 button { background:transparent; color:#262626; border:1px solid transparent; border-radius:0; padding:0 8px;
    font-size:11.5px; text-align:left; height:21px; font-family:inherit; cursor:pointer; }
  body.excel #bar3 button:hover { background:#d2e8db; border-color:#c4d9cc; }
  body.excel #bar3 button.on { background:#c5ddcf; border-color:#a9c9b6; }
  #bar .theme.l { border-radius:7px 0 0 7px; margin-left:6px; } #bar .theme.r { border-radius:0 7px 7px 0; margin-left:-7px; }
  body.excel #xl-formula { display:flex !important; align-items:center; height:26px; border-bottom:1px solid #d5d5d5; background:#fff; flex:none; font-size:12.5px; }
  body.excel #namebox { width:90px; border-right:1px solid #d5d5d5; height:100%; line-height:25px; padding:0 6px; }
  body.excel .fxbtn { color:#777; padding:0 10px; border-right:1px solid #d5d5d5; height:100%; line-height:25px; white-space:nowrap; }
  body.excel .fxbtn i { font-family:serif; color:#444; }
  body.excel #fx { padding:0 8px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:1; color:#222; font-variant-numeric:tabular-nums; }
  body.excel #sheet { display:block; position:relative; flex:1; min-height:0; overflow:hidden; }
  body.excel #corner { position:absolute; left:0; top:0; width:34px; height:20px; background:#f3f3f3; border-right:1px solid #c8c8c8; border-bottom:1px solid #c8c8c8; }
  body.excel #colhdr { position:absolute; left:34px; right:0; top:0; height:20px; display:flex !important; background:#f3f3f3; border-bottom:1px solid #c8c8c8; overflow:hidden; }
  body.excel #colhdr div { flex:none; width:80px; text-align:center; line-height:19px; font-size:11.5px; color:#444; border-right:1px solid #d4d4d4; }
  body.excel #rowhdr { position:absolute; left:0; top:20px; bottom:0; width:34px; background:#f3f3f3; border-right:1px solid #c8c8c8; overflow:hidden; }
  body.excel #rowhdr div { height:20px; line-height:19px; text-align:center; font-size:11.5px; color:#444; border-bottom:1px solid #d4d4d4; }
  body.excel #colhdr div.hl, body.excel #rowhdr div.hl { background:#d2d2d2; color:var(--xg); }
  body.excel #cells { display:block; position:absolute; left:34px; top:20px; right:0; bottom:0; overflow:hidden;
    background-image:linear-gradient(to right, var(--xline) 1px, transparent 1px), linear-gradient(to bottom, var(--xline) 1px, transparent 1px);
    background-size:80px 20px; background-position:-1px -1px; }
  body.excel #top { position:absolute; left:0; top:0; padding:0; gap:0; display:flex; }
  body.excel #top .lbl { display:none !important; }
  body.excel #top .lbl div, body.excel .coin > div { height:20px; line-height:20px; padding:0 4px; white-space:nowrap; overflow:hidden; font-size:12.5px; }
  body.excel #top .lbl div { font-weight:700; color:#222; }
  body.excel .coin { flex:none; width:160px; background:transparent; border:none; border-radius:0; padding:0; transition:none; }
  body.excel .coin.on { box-shadow:none; outline:2px solid var(--xg); outline-offset:-1px; }
  body.excel .coin .name { color:#222; font-weight:700; }
  body.excel .coin .name span { opacity:1 !important; font-weight:400; color:#555; }
  body.excel .coin .price { font-size:12.5px; font-weight:400; margin:0; text-align:right; }
  body.excel .coin .chg { text-align:right; }
  body.excel .up { color:#c00000; } body.excel .down { color:#0050c8; } body.excel .flat { color:#555; }
  body.excel #wrap { position:absolute; left:6px; top:70px; right:14px; bottom:10px; background:#fff; border:1px solid #bfbfbf; }
  body.excel #legend { color:#595959; }
  body.excel #sel { position:absolute; border:2px solid var(--xg); pointer-events:none; display:none; z-index:5; }
  /* + 카드, 빼기 ×, 코인 고르기 창 */
  #top { overflow-x:auto; scrollbar-width:thin; scrollbar-color:var(--line) transparent; }
  .coin { position:relative; min-width:150px; }
  .coin .price, .coin .chg, .coin .name { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  body:not(.excel) .coin .price { font-size:18px; }
  .coin.addcard { flex:none; min-width:0; width:44px; display:flex; align-items:center; justify-content:center; font-size:26px; color:var(--dim); padding:0; }
  .coin.addcard:hover { color:var(--text); border-color:var(--accent); }
  .coin .x { position:absolute; right:6px; top:2px; font-size:15px; color:var(--dim); display:none; padding:0 4px; }
  .coin:hover .x { display:block; } .coin .x:hover { color:#ff6b6b; }
  body.excel .coin.addcard { display:none; }
  /* 카드 줄 좌우 넘김 버튼 (기본 테마, 카드가 넘칠 때만). 스크롤바는 그대로 두고 양쪽 끝에 붙어 있음 */
  .tarrow { display:none; position:sticky; z-index:3; flex:none; width:30px; align-items:center; justify-content:center;
    background:var(--panel); border:1px solid var(--line); border-radius:10px; color:var(--text); font-size:20px; cursor:pointer; user-select:none; }
  .tarrow.l { left:0; order:-1; box-shadow:6px 0 8px var(--bg); } .tarrow.r { right:0; order:999; box-shadow:-6px 0 8px var(--bg); }
  .tarrow:hover { border-color:var(--accent); }
  .tarrow.off { color:var(--line); cursor:default; border-color:var(--line); }
  #top.over .tarrow { display:flex; }
  body.excel .tarrow { display:none !important; }
  body.excel .coin .x { top:0; right:2px; font-size:13px; }
  body.excel #xl-sheets .plus { cursor:pointer; } body.excel #xl-sheets .plus:hover { color:var(--xg); }
  body.excel #top { overflow:visible; flex-wrap:wrap; }
  #picker { display:none; position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:50; align-items:center; justify-content:center; }
  #picker.show { display:flex; }
  #picker .pbox { width:min(420px, 92vw); max-height:80vh; display:flex; flex-direction:column; background:var(--panel); color:var(--text);
    border:1px solid var(--line); border-radius:12px; overflow:hidden; }
  #picker .phead { display:flex; justify-content:space-between; padding:12px 14px; font-size:15px; }
  #picker .pclose { cursor:pointer; font-size:20px; color:var(--dim); line-height:1; }
  #picker .psearch { margin:0 14px 8px; padding:8px 10px; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:var(--text); font:inherit; font-size:14px; }
  #picker .plist { overflow-y:auto; flex:1; min-height:120px; padding:0 6px; font-size:14px; color:var(--dim); }
  #picker .prow { display:flex; gap:8px; padding:7px 8px; border-radius:7px; cursor:pointer; color:var(--text); }
  #picker .prow:hover { background:var(--line); }
  #picker .prow .sym { color:var(--dim); } #picker .prow .st { margin-left:auto; color:var(--accent); font-size:13px; }
  #picker .prow.have { cursor:default; opacity:.5; } #picker .prow.have .st { color:var(--dim); }
  #picker .pfoot { padding:8px 14px 12px; border-top:1px solid var(--line); }
  #picker .preset { background:transparent; color:var(--dim); border:1px solid var(--line); border-radius:7px; padding:5px 10px; font:inherit; font-size:12px; cursor:pointer; }
  body.excel #picker .pbox { --panel:#fff; --text:#222; --dim:#666; --line:#d5d5d5; --bg:#fff; --accent:#217346; border-radius:2px; box-shadow:0 8px 30px rgba(0,0,0,.25); }
  /* 끌어서 순서 바꾸기 표시 */
  .dragging { opacity:.4; }
  .coin.dropL { box-shadow:-3px 0 0 0 var(--accent); } .coin.dropR { box-shadow:3px 0 0 0 var(--accent); }
  #sheettabs span.dropL { box-shadow:inset 3px 0 0 0 #217346; } #sheettabs span.dropR { box-shadow:inset -3px 0 0 0 #217346; }
  #divAlert { display:none; color:#ff3b3b; font-weight:800; font-size:14px; padding:0 8px; cursor:pointer; white-space:nowrap;
    animation:blink 1s steps(1) infinite; }
  #divAlert.show { display:inline-block; }
  @keyframes blink { 50% { opacity:0; } }
  body.excel #divAlert { color:#e00000; font-size:12.5px; grid-row:1 / span 3; align-self:center; }
  /* Sheet1: 빈 시트 (차트·시세·알림 글자 모두 숨김) */
  body.excel.blank #top, body.excel.blank #wrap, body.excel.blank #fx, body.excel.blank #st-info, body.excel.blank #divAlert { visibility:hidden; }
  body.excel #sel:not(.show) { display:none !important; }
  body.excel .grp.xl-only { display:flex !important; }
  body.excel #xl-sheets { display:flex !important; align-items:stretch; height:26px; background:#f3f3f3; border-top:1px solid #d5d5d5; flex:none; font-size:12.5px; }
  body.excel #xl-sheets .arr, body.excel #xl-sheets .plus { color:#999; padding:0 10px; line-height:25px; }
  body.excel #sheettabs { display:flex; }
  body.excel #sheettabs span { padding:0 16px; line-height:24px; border-right:1px solid #d5d5d5; cursor:default; color:#333; }
  body.excel #sheettabs span.on { background:#fff; color:var(--xg); font-weight:700; border-bottom:2px solid var(--xg); }
  body.excel #xl-status { display:flex !important; align-items:center; gap:16px; height:22px; background:#f3f3f3; border-top:1px solid #e1e1e1; padding:0 10px; font-size:11.5px; color:#444; flex:none; }
  body.excel #st-info { flex:1; text-align:right; }
  body.excel #bar .info, body.excel #bar2 .info { display:none; }
  /* 업비트 주문 창 (오른쪽에서 열림). 맥판처럼 파이썬이 주문 기능을 알려 줄 때만 버튼이 보임 */
  #tradeBtn { display:none; } #tradeBtn.ready { display:inline-block; }
  #bar #tradeBtn.ready { border-color:var(--accent); }
  #trade { display:none; position:fixed; top:0; right:0; bottom:0; width:min(340px, 100vw); z-index:40; background:var(--panel); color:var(--text);
    border-left:1px solid var(--line); box-shadow:-8px 0 24px rgba(0,0,0,.35); flex-direction:column; font-size:13px; }
  #trade.show { display:flex; }
  #trade .thead { display:flex; justify-content:space-between; align-items:center; padding:12px 14px; font-size:15px; border-bottom:1px solid var(--line); }
  #trade .tclose { cursor:pointer; font-size:20px; color:var(--dim); line-height:1; }
  #trade .tbody { overflow-y:auto; flex:1; padding:12px 14px 20px; }
  #trade label { display:block; margin:8px 0 0; color:var(--dim); font-size:12px; }
  #trade input { display:block; width:100%; margin-top:3px; padding:7px 9px; border-radius:7px; border:1px solid var(--line); background:var(--bg);
    color:var(--text); font:inherit; font-size:14px; font-variant-numeric:tabular-nums; }
  #trade .tnote { color:var(--dim); font-size:12px; line-height:1.55; margin:0 0 6px; padding-left:16px; }
  #trade p.tnote { padding-left:0; }
  #trade .tnote b { color:var(--text); }
  #trade .tbtn { width:100%; margin-top:12px; padding:9px; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:var(--text);
    font:inherit; font-size:14px; font-weight:700; cursor:pointer; }
  #trade .tbtn.bid { background:var(--up); border-color:var(--up); color:#fff; }
  #trade .tbtn.ask { background:var(--down); border-color:var(--down); color:#fff; }
  #trade .tbtn.main { background:var(--accent); border-color:var(--accent); color:#fff; }
  #trade .tbtn:disabled { opacity:.5; cursor:default; }
  #trade .tlink { background:none; border:none; color:var(--dim); font:inherit; font-size:12px; cursor:pointer; text-decoration:underline; padding:0; }
  #trade .trow { display:flex; justify-content:space-between; align-items:center; color:var(--dim); font-size:12px; }
  #trade .tmk { font-size:16px; font-weight:700; margin:10px 0 6px; }
  #trade .tseg { display:flex; margin-top:8px; border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  #trade .tseg button { flex:1; padding:7px; background:transparent; border:none; color:var(--dim); font:inherit; cursor:pointer; }
  #trade .tseg button.on { background:var(--line); color:var(--text); font-weight:700; }
  #trade #t-side button.on[data-v="bid"] { background:var(--up); color:#fff; }
  #trade #t-side button.on[data-v="ask"] { background:var(--down); color:#fff; }
  #trade .tbal { display:flex; justify-content:space-between; margin-top:8px; color:var(--dim); font-size:12px; font-variant-numeric:tabular-nums; }
  #trade .tbal b { color:var(--text); font-weight:600; }
  #trade .tpct { display:flex; gap:4px; margin-top:6px; }
  #trade .tpct button { flex:1; padding:4px 0; border-radius:6px; border:1px solid var(--line); background:transparent; color:var(--dim); font:inherit; font-size:12px; cursor:pointer; }
  #trade .tmsg { margin-top:8px; font-size:12px; line-height:1.5; color:var(--dim); white-space:pre-line; }
  #trade .tmsg.bad { color:#ff6b6b; } #trade .tmsg.good { color:#2ed573; }
  #trade .tsub { display:flex; justify-content:space-between; align-items:center; margin:18px 0 6px; padding-top:12px; border-top:1px solid var(--line); font-weight:700; }
  #trade .tord { display:flex; align-items:center; gap:8px; padding:6px 0; border-bottom:1px solid var(--line); font-size:12px; font-variant-numeric:tabular-nums; }
  #trade .tord .s { font-weight:700; } #trade .tord .s.bid { color:var(--up); } #trade .tord .s.ask { color:var(--down); }
  #trade .tord .d { flex:1; color:var(--dim); line-height:1.45; } #trade .tord .d b { color:var(--text); font-weight:600; }
  #trade .tord button { background:transparent; border:1px solid var(--line); border-radius:6px; color:var(--dim); font:inherit; font-size:12px; padding:3px 8px; cursor:pointer; }
  #tconfirm { display:none; position:fixed; inset:0; z-index:60; background:rgba(0,0,0,.5); align-items:center; justify-content:center; }
  #tconfirm.show { display:flex; }
  #tconfirm .cbox { width:min(340px, 92vw); background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:12px; padding:16px; font-size:14px; }
  #tconfirm #tc-body { margin:10px 0 14px; line-height:1.7; white-space:pre-line; font-variant-numeric:tabular-nums; }
  #tconfirm .cbtns { display:flex; gap:8px; }
  #tconfirm .cbtns button { flex:1; padding:9px; border-radius:8px; border:1px solid var(--line); background:transparent; color:var(--text); font:inherit; font-weight:700; cursor:pointer; }
  #tconfirm #tc-yes.bid { background:var(--up); border-color:var(--up); color:#fff; }
  #tconfirm #tc-yes.ask { background:var(--down); border-color:var(--down); color:#fff; }
  body.excel #trade, body.excel #tconfirm .cbox { --panel:#fff; --text:#222; --dim:#666; --line:#d5d5d5; --bg:#fff; --accent:#217346; --up:#c00000; --down:#0050c8; }
  body.excel #trade { box-shadow:-6px 0 20px rgba(0,0,0,.18); }

  /* ---------- 미국 경제지표 흐르는 띠, 발표 캘린더 ---------- */

// 맥판 pywebview 는 window.webkit 을 자기 통로로 쓰므로 window.webkit 을 덮어쓰면 안 됨 (덮어써서 차트 요청이 전부 끊긴 적 있음)
window.mjPost = (() => {
  const h = window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.mjcoin;
  if (h) return m => h.postMessage(m);
  const q = []; let ready = false;
  const send = m => window.pywebview.api.post(m);
  const go = () => { if (!ready) { ready = true; q.splice(0).forEach(send); } };
  window.addEventListener("pywebviewready", go);
  if (window.pywebview && window.pywebview.api && window.pywebview.api.post) go();
  return m => ready ? send(m) : q.push(m);
})();
window.mjWsBatch = arr => arr.forEach(t => window.mjWs(t));
// 기본 종목 (코인 5 + 주식 1). + 버튼으로 추가한 목록은 localStorage "mjCoins"에 저장

const COINS = (() => { try { const v = JSON.parse(localStorage.getItem("mjCoins")); if (Array.isArray(v) && v.length) return v; } catch (e) {} return DEFAULT_COINS.map(x => x.slice()); })();
// 예전에 저장된 목록에는 비트코인 USDT가 없으니 한 번만 비트코인(원화) 바로 뒤에 넣어 줌

  localStorage.setItem("mjUsdtBtc", "1"); localStorage.setItem("mjCoins", JSON.stringify(COINS)); } } catch (e) {}

  if (p == null || isNaN(p)) return "-";

}

let dragCode = null;
function enableDrag(el, code) {
  el.draggable = true;
  el.addEventListener("dragstart", e => { dragCode = code; el.classList.add("dragging"); e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setData("text/plain", code); });

  el.addEventListener("dragover", e => {
    if (!dragCode || dragCode === code) return;
    e.preventDefault(); e.dataTransfer.dropEffect = "move";
    const r = el.getBoundingClientRect(), right = e.clientX > r.left + r.width/2;
    el.classList.toggle("dropR", right); el.classList.toggle("dropL", !right);

  });
}

function calcBB(n = 20, k = 2) {
  const up = [], mid = [], lo = [];
  for (let i = 0; i < candles.length; i++) {
    const t = candles[i].time;
    if (i < n-1) { up.push({time:t}); mid.push({time:t}); lo.push({time:t}); continue; }
    let s = 0; for (let j = i-n+1; j <= i; j++) s += candles[j].close;
    const m = s/n; let v = 0; for (let j = i-n+1; j <= i; j++) v += (candles[j].close - m) ** 2;
    const sd = Math.sqrt(v/n);
    up.push({time:t, value:m + k*sd}); mid.push({time:t, value:m}); lo.push({time:t, value:m - k*sd});
  }
  return { up, mid, lo };
}

function sma(arr, n) {
  return arr.map((_, i) => {
    if (i < n-1) return null;
    let s = 0; for (let j = i-n+1; j <= i; j++) { if (arr[j] == null) return null; s += arr[j]; }
    return s/n;
  });
}
function calcStoch(n = 14, k = 3, d = 3) {
  const fast = candles.map((c, i) => {
    if (i < n-1) return null;
    let hi = -Infinity, lo = Infinity;
    for (let j = i-n+1; j <= i; j++) { hi = Math.max(hi, candles[j].high); lo = Math.min(lo, candles[j].low); }
    return hi === lo ? 50 : (c.close - lo) / (hi - lo) * 100;
  });
  const K = sma(fast, k); return { K, D: sma(K, d) };
}

function calcRSI(n = 14) {
  const out = new Array(candles.length).fill(null);
  if (candles.length <= n) return out;
  let g = 0, l = 0;
  for (let i = 1; i <= n; i++) { const d = candles[i].close - candles[i-1].close; if (d > 0) g += d; else l -= d; }
  g /= n; l /= n; out[n] = l === 0 ? 100 : 100 - 100/(1 + g/l);
  for (let i = n+1; i < candles.length; i++) {
    const d = candles[i].close - candles[i-1].close;
    g = (g*(n-1) + Math.max(d,0))/n; l = (l*(n-1) + Math.max(-d,0))/n;
    out[i] = l === 0 ? 100 : 100 - 100/(1 + g/l);
  }
  return out;
}

}

  // 다이버전스: 가격 저점은 낮아지는데 RSI 저점은 높아지면 상승, 가격 고점은 높아지는데 RSI 고점은 낮아지면 하락
  const k = 3, marks = [];

// 분봉은 1분봉을 받아서 3·5·10…분으로 묶음. 정규장 + 넥스트레이드(08:00~20:00) 포함.
const NAVER = "https://api.stock.naver.com/chart/domestic/item/";
const p2 = x => String(x).padStart(2, "0");
function kstYmd(daysBack) { const d = new Date(Date.now() + KST*1000 - daysBack*86400000);
  return `${d.getUTCFullYear()}${p2(d.getUTCMonth()+1)}${p2(d.getUTCDate())}`; }
const nvTime = s => kstSec(`${s.slice(0,4)}-${s.slice(4,6)}-${s.slice(6,8)}T${s.slice(8,10)||"00"}:${s.slice(10,12)||"00"}:00`);
async function stockCandles() {
  const code = market.slice(6);
  let rows, out = [];
  if ("DWM".includes(tf)) {
    const kind = {D:"day", W:"week", M:"month"}[tf], days = {D:420, W:1600, M:7000}[tf];
    rows = await nativeGet(`${NAVER}${code}/${kind}?startDateTime=${kstYmd(days)}0000&endDateTime=${kstYmd(0)}2359`);
    if (!Array.isArray(rows)) throw new Error(JSON.stringify(rows));
    out = rows.map(r => ({ time:nvTime(r.localDate), open:r.openPrice, high:r.highPrice, low:r.lowPrice, close:r.closePrice, volume:r.accumulatedTradingVolume }));
  } else {
    const m = Number(tf), days = Math.min(40, Math.ceil(200*m/720*1.5) + 4);
    rows = await nativeGet(`${NAVER}${code}/minute?startDateTime=${kstYmd(days)}0000&endDateTime=${kstYmd(0)}2359`);
    if (!Array.isArray(rows)) throw new Error(JSON.stringify(rows));
    for (const r of rows) {     // accumulatedTradingVolume는 이름과 달리 1분 거래량 (합계 = 하루 거래량, 확인함)
      const t0 = nvTime(r.localDateTime), t = t0 - t0 % (m*60), last = out[out.length-1];
      if (last && last.time === t) {
        last.high = Math.max(last.high, r.highPrice); last.low = Math.min(last.low, r.lowPrice);
        last.close = r.currentPrice; last.volume += r.accumulatedTradingVolume;
      } else out.push({ time:t, open:r.openPrice, high:r.highPrice, low:r.lowPrice, close:r.currentPrice, volume:r.accumulatedTradingVolume });
    }
  }
  return out.slice(-200);
}

async function pollStock() {

      const d = j.datas[0];
      setCard(code, d.closePriceRaw, Number(d.fluctuationsRatioRaw)/100, Number(d.compareToPreviousClosePriceRaw));
      stockLive = d.marketStatus === "OPEN" || (d.overMarketPriceInfo && d.overMarketPriceInfo.overMarketStatus === "OPEN");
    } catch (e) {}
  }
}

  const t = Math.floor(tsMs/1000) + KST;
  let last = candles[candles.length-1];
  if (t < last.time) return;
  let newBar = false;
  while (t >= nextStart(last.time)) {
    last = { time:nextStart(last.time), open:price, high:price, low:price, close:price, volume:0 };
    candles.push(last); newBar = true;
  }
  last.high = Math.max(last.high, price); last.low = Math.min(last.low, price);
  last.close = price; last.volume += vol;
  cs.update(last); vs.update(volBar(last)); dirty = true;
  if (newBar) drawTrend();
}

// ---------- 추세선 (최근 고점 2개 / 저점 2개 연결) ----------
function pivots(key, isHigh, k) {
  const out = [];
  for (let i = k; i < candles.length - k; i++) {
    let ok = true;
    for (let j = i-k; j <= i+k && ok; j++) {
      if (j === i) continue;
      if (isHigh ? candles[j][key] > candles[i][key] : candles[j][key] < candles[i][key]) ok = false;
    }
    if (ok) out.push(i);
  }
  return out;
}
function lineThrough(i1, i2, key) {
  const a = candles[i1], b = candles[i2], end = candles.length - 1;
  const slope = (b[key] - a[key]) / (i2 - i1);
  return [{ time:a.time, value:a[key] }, { time:candles[end].time, value:a[key] + slope*(end - i1) }];
}
function drawTrend() {
  if (!showTrend || candles.length < 30) { tRes.setData([]); tSup.setData([]); return; }
  const k = 5;
  const hs = pivots("high", true, k), ls = pivots("low", false, k);
  tRes.setData(hs.length >= 2 ? lineThrough(hs[hs.length-2], hs[hs.length-1], "high") : []);
  tSup.setData(ls.length >= 2 ? lineThrough(ls[ls.length-2], ls[ls.length-1], "low") : []);
}

// ---------- 매물대 (가격대별 거래량, 화면에 보이는 구간 기준) ----------
const vp = document.getElementById("vp"), g = vp.getContext("2d");
function drawVP() {
  const w = box.clientWidth, h = box.clientHeight, dpr = window.devicePixelRatio || 1;
  if (vp.width !== w*dpr || vp.height !== h*dpr) { vp.width = w*dpr; vp.height = h*dpr; vp.style.width = w+"px"; vp.style.height = h+"px"; }
  g.setTransform(dpr,0,0,dpr,0,0); g.clearRect(0,0,w,h);
  if (!showVP || !candles.length) return;
  const rng = chart.timeScale().getVisibleLogicalRange();
  const from = Math.max(0, Math.floor(rng ? rng.from : 0)), to = Math.min(candles.length-1, Math.ceil(rng ? rng.to : candles.length-1));
  const vis = candles.slice(from, to+1); if (!vis.length) return;
  let lo = Infinity, hi = -Infinity;
  for (const c of vis) { lo = Math.min(lo, c.low); hi = Math.max(hi, c.high); }
  if (!(hi > lo)) return;
  const N = 32, step = (hi - lo)/N, bins = new Array(N).fill(0);
  for (const c of vis) {                      // 봉 거래량을 고가~저가 구간에 고르게 나눔
    const a = Math.max(0, Math.floor((c.low - lo)/step)), b = Math.min(N-1, Math.floor((c.high - lo)/step));
    const share = c.volume / (b - a + 1);
    for (let i = a; i <= b; i++) bins[i] += share;
  }
  const max = Math.max(...bins), poc = bins.indexOf(max);
  const scaleW = chart.priceScale("right").width(), maxW = (w - scaleW) * 0.22;
  for (let i = 0; i < N; i++) {
    const y1 = cs.priceToCoordinate(lo + step*(i+1)), y2 = cs.priceToCoordinate(lo + step*i);
    if (y1 == null || y2 == null) continue;
    const bw = bins[i]/max * maxW;
    g.fillStyle = i === poc ? "rgba(255,193,7,.45)" : "rgba(124,92,255,.22)";
    g.fillRect(w - scaleW - bw, Math.min(y1,y2)+1, bw, Math.max(1, Math.abs(y2-y1)-2));
  }
}
